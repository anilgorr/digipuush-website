# Build runs from the repo root so pnpm installs the whole workspace and
# resolves `catalog:` specifiers (npm cannot). The publish dir points at the
# Digipuush app's Next.js build output for Netlify's monorepo support.
[build]
  command = "pnpm --filter @workspace/digipuush run build"
  publish = "artifacts/digipuush/.next"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# Force HTTPS + apex host so Search Console stops reporting http://digipuush.com/
# as a separate page. Netlify normally does this automatically; this makes it explicit.
[[redirects]]
  from = "http://digipuush.com/*"
  to = "https://digipuush.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://www.digipuush.com/*"
  to = "https://digipuush.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.digipuush.com/*"
  to = "https://digipuush.com/:splat"
  status = 301
  force = true
